[project]
name = "personal-memory"
version = "0.1.0"
description = "Local personal memory service for Codex"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "mcp>=2,<3",
  "httpx>=0.28,<1",
  "jieba>=0.42.1,<1",
  "sqlite-vec>=0.1.7,<0.2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]

